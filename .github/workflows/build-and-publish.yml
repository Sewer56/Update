name: Build and Publish

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env: 
  TOOLS_PATH: ./Publish/Tools
  PUBLISH_CHANGELOG_PATH: ./Publish/Changelog.md 
  PUBLISH_PACKAGES_PATH: ./Publish/Packages
  PUBLISH_PATH: ./Publish
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  RELEASE_TAG: ${{ github.ref_name }}
  SOLUTION_PATH: ./Sewer56.Update/Sewer56.Update.sln
  TOOL_PATH: ./Sewer56.Update/Sewer56.Update.Tool/Sewer56.Update.Tool.csproj

jobs:
  # ── Test Matrix: one job per OS+TFM ──────────────────────────────
  # Legacy TFMs (netcoreapp3.1, net5.0) tested on Windows only.
  # libssl1.1 missing on Ubuntu 24.04 → test host crashes for old TFMs.
  # net10.0 tested on Ubuntu (cheap, original platform).
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: netcoreapp3.1
          - os: windows-latest
            tfm: net5.0
          - os: ubuntu-latest
            tfm: net10.0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          3.1.x
          5.0.x
          6.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore $env:SOLUTION_PATH
    - name: Build
      run: dotnet build -c Release $env:SOLUTION_PATH --no-restore
    - name: Test (${{ matrix.tfm }})
      run: dotnet test -c Release ./Sewer56.Update/Sewer56.Update.Tests/Sewer56.Update.Tests.csproj --no-build -f ${{ matrix.tfm }} --verbosity normal

  # ── Self-Contained Tool: one job per RID (alongside legacy artifact) ──
  # net10.0 self-contained: bundles runtime, no .NET install needed on host.
  # Distinct from legacy net5.0 framework-dependent Tools artifact.
  publish-tool:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK (10.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish Tool (Self-Contained)
      run: |
        dotnet publish $env:TOOL_PATH -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained -o "./Temp/Update.Tool-${{ matrix.rid }}"
        [IO.Compression.ZipFile]::CreateFromDirectory("./Temp/Update.Tool-${{ matrix.rid }}", "Sewer56.Update.Tool-${{ matrix.rid }}.zip")

    - name: Upload Tool Artifact (Self-Contained)
      uses: actions/upload-artifact@v4
      with:
        name: Tool-${{ matrix.rid }}
        path: Sewer56.Update.Tool-${{ matrix.rid }}.zip
        retention-days: 0

  # ── NuGet Packages + Changelog + Legacy Tool ─────────────────────
  # Legacy tool: net5.0 framework-dependent → original Tools artifact
  # (unchanged name/format for downstream CI compatibility).
  pack:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          3.1.x
          5.0.x
          6.0.x
          10.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup AutoChangelog
      run: npm install -g auto-changelog

    - name: Restore dependencies
      run: dotnet restore $env:SOLUTION_PATH
    - name: Build
      run: dotnet build -c Release $env:SOLUTION_PATH --no-restore

    - name: Publish Update Tool (Legacy - net5.0 Framework-Dependent)
      run: |
        [System.IO.Directory]::CreateDirectory("$env:TOOLS_PATH")
        dotnet publish $env:TOOL_PATH -c Release -f net5.0 -o "./Temp/Update.Tool"
        [IO.Compression.ZipFile]::CreateFromDirectory("./Temp/Update.Tool", "$env:TOOLS_PATH/" + "Sewer56.Update.Tool.zip")

    - name: Create NuGet Package Artifacts
      run: |
        [System.IO.Directory]::CreateDirectory("$env:PUBLISH_PACKAGES_PATH")
        $items = Get-ChildItem -Path "." -Recurse | Where-Object { $_.Name -match "Sewer56.*.nupkg" }
        foreach ($item in $items)
        {
          Write-Host "Moving $item -> $env:PUBLISH_PACKAGES_PATH"
          Move-Item -Path "$item" -Destination "$env:PUBLISH_PACKAGES_PATH"
        }

    - name: Create Changelog
      run: |
        [System.IO.Directory]::CreateDirectory("$env:PUBLISH_PATH")
        if ($env:IS_RELEASE -eq 'true') 
        {
            auto-changelog --sort-commits date --hide-credit --template keepachangelog --commit-limit false --unreleased --starting-version "$env:RELEASE_TAG" --output "$env:PUBLISH_CHANGELOG_PATH"
        }
        else 
        {
            auto-changelog --sort-commits date --hide-credit --template keepachangelog --commit-limit false --unreleased --output "$env:PUBLISH_CHANGELOG_PATH"
        }

    - name: Upload NuGet Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Packages
        path: ${{ env.PUBLISH_PACKAGES_PATH }}/*
        retention-days: 0

    - name: Upload Changelog Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Changelog
        path: ${{ env.PUBLISH_CHANGELOG_PATH }}
        retention-days: 0

    - name: Upload Tools Artifact (Legacy)
      uses: actions/upload-artifact@v4
      with:
        name: Tools
        path: ${{ env.TOOLS_PATH }}
        retention-days: 0

  # ── Release: GitHub Releases + NuGet (on Tag only) ───────────────
  release:
    runs-on: ubuntu-latest
    needs: [test, publish-tool, pack]
    if: startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./Publish

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        body_path: ./Publish/Changelog/Changelog.md
        files: |
          ./Publish/NuGet Packages/*.nupkg
          ./Publish/Tools/Sewer56.Update.Tool.zip
          ./Publish/Tool-win-x64/*.zip
          ./Publish/Tool-linux-x64/*.zip

    - name: Upload to NuGet
      env: 
        NUGET_KEY: ${{ secrets.NUGET_KEY }}
      run: |
        $items = Get-ChildItem -Path "./Publish/NuGet Packages/*.nupkg"
        Foreach ($item in $items)
        {
            Write-Host "Pushing $item"
            dotnet nuget push "$item" -k "$env:NUGET_KEY" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
        }
